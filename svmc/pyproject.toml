[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svmc"
version = "0.2.0"
description = "SVMC v0: pure-Python simulator of virtual nodes with a policy gate and append-only audit chain"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[tool.setuptools.packages.find]
include = ["svmc*"]
